services:
  db:
    image: postgres:16-alpine
    container_name: cinevide-db
    environment:
      POSTGRES_USER: cinevide
      POSTGRES_PASSWORD: cinevide_dev
      POSTGRES_DB: cinevide
    ports:
      - "127.0.0.1:54322:5432"
    volumes:
      - cinevide-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinevide -d cinevide"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cinevide-pgdata:
